<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat - Powered by Groq</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #212121;
            --bg-secondary: #171717;
            --bg-tertiary: #2f2f2f;
            --text-primary: #ececec;
            --text-secondary: #b4b4b4;
            --accent: #10a37f;
            --border: #424242;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 260px;
            background: var(--bg-secondary);
            padding: 8px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: var(--bg-tertiary);
        }

        .sidebar-title {
            padding: 12px;
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .header {
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .model-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            font-size: 14px;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .welcome-logo {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .welcome-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 32px;
        }

        .suggestions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 600px;
        }

        .suggestion-card {
            padding: 16px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
            border: 1px solid var(--border);
        }

        .suggestion-card:hover {
            background: #3a3a3a;
        }

        .suggestion-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .suggestion-desc {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .message {
            padding: 24px 0;
            border-bottom: 1px solid var(--border);
        }

        .message:last-child {
            border-bottom: none;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .message-avatar.user {
            background: #5c46d9;
        }

        .message-avatar.assistant {
            background: var(--accent);
        }

        .message-role {
            font-weight: 600;
            font-size: 14px;
        }

        .message-content {
            padding-left: 44px;
            line-height: 1.7;
            font-size: 15px;
            white-space: pre-wrap;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }

        .input-area {
            padding: 16px 24px 24px;
        }

        .input-container {
            position: relative;
            background: var(--bg-tertiary);
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .input-container:focus-within {
            border-color: var(--text-secondary);
        }

        #messageInput {
            width: 100%;
            padding: 16px 56px 16px 16px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 15px;
            resize: none;
            min-height: 56px;
            max-height: 200px;
            outline: none;
            font-family: inherit;
        }

        #messageInput::placeholder {
            color: var(--text-secondary);
        }

        .send-btn {
            position: absolute;
            right: 12px;
            bottom: 12px;
            width: 32px;
            height: 32px;
            background: var(--text-primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .send-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .send-btn svg {
            width: 16px;
            height: 16px;
            fill: var(--bg-primary);
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 12px;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .suggestions { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <button class="new-chat-btn" onclick="newChat()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14"/>
            </svg>
            New chat
        </button>
        <div class="sidebar-title">Today</div>
    </aside>

    <main class="main-content">
        <header class="header">
            <div class="model-selector">
                <span>🤖</span>
                <span>AI Assistant</span>
            </div>
        </header>

        <div class="chat-area" id="chatArea">
            <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-logo">🤖</div>
                <h1 class="welcome-title">How can I help you today?</h1>
                <div class="suggestions">
                    <div class="suggestion-card" onclick="sendSuggestion('Explain quantum computing in simple terms')">
                        <div class="suggestion-title">Explain quantum computing</div>
                        <div class="suggestion-desc">in simple terms</div>
                    </div>
                    <div class="suggestion-card" onclick="sendSuggestion('Write a Python function to reverse a string')">
                        <div class="suggestion-title">Write Python code</div>
                        <div class="suggestion-desc">to reverse a string</div>
                    </div>
                    <div class="suggestion-card" onclick="sendSuggestion('What are the best practices for REST API design?')">
                        <div class="suggestion-title">Best practices</div>
                        <div class="suggestion-desc">for REST API design</div>
                    </div>
                    <div class="suggestion-card" onclick="sendSuggestion('Help me write a professional email')">
                        <div class="suggestion-title">Write an email</div>
                        <div class="suggestion-desc">professional tone</div>
                    </div>
                </div>
            </div>
            <div id="messagesContainer"></div>
        </div>

        <div class="input-area">
            <div class="input-container">
                <textarea 
                    id="messageInput" 
                    placeholder="Message AI Assistant..." 
                    rows="1"
                ></textarea>
                <button class="send-btn" id="sendBtn" disabled>
                    <svg viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
            <p class="footer-note">Powered by AI</p>
        </div>
    </main>

    <script>
        const API_BASE = window.location.origin;
        let conversationId = null;
        let isStreaming = false;

        const chatArea = document.getElementById('chatArea');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
            sendBtn.disabled = !this.value.trim() || isStreaming;
        });

        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        function sendSuggestion(text) {
            messageInput.value = text;
            sendMessage();
        }

        function newChat() {
            conversationId = null;
            messagesContainer.innerHTML = '';
            welcomeScreen.style.display = 'flex';
            messageInput.value = '';
            messageInput.style.height = 'auto';
            sendBtn.disabled = true;
        }

        function addMessage(content, role, streaming) {
            welcomeScreen.style.display = 'none';
            
            var msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            
            var avatar = role === 'user' ? '👤' : '🤖';
            var roleName = role === 'user' ? 'You' : 'Assistant';
            
            var contentHtml = content || '';
            if (streaming && !content) {
                contentHtml = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
            }
            
            msgDiv.innerHTML = 
                '<div class="message-header">' +
                    '<div class="message-avatar ' + role + '">' + avatar + '</div>' +
                    '<span class="message-role">' + roleName + '</span>' +
                '</div>' +
                '<div class="message-content">' + contentHtml + '</div>';
            
            messagesContainer.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
            
            return msgDiv;
        }

        function updateMessageWithTitle(msgDiv, title, explanation) {
            var contentEl = msgDiv.querySelector('.message-content');
            contentEl.innerHTML = '<strong style="font-size: 16px; color: #10a37f;">' + title + '</strong><br><br>' + explanation;
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        async function sendMessage() {
            var message = messageInput.value.trim();
            if (!message || isStreaming) return;

            isStreaming = true;
            sendBtn.disabled = true;
            messageInput.value = '';
            messageInput.style.height = 'auto';

            addMessage(message, 'user', false);
            var assistantMsg = addMessage('', 'assistant', true);

            try {
                var response = await fetch(API_BASE + '/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        conversationId: conversationId
                    })
                });

                var data = await response.json();
                conversationId = data.conversationId;
                
                updateMessageWithTitle(assistantMsg, data.title, data.explanation);
                isStreaming = false;
                sendBtn.disabled = false;

            } catch (error) {
                updateMessageWithTitle(assistantMsg, 'Error', 'Could not connect to server. Make sure the backend is running.');
                isStreaming = false;
                sendBtn.disabled = false;
            }
        }

        messageInput.focus();
    </script>
</body>
</html>
