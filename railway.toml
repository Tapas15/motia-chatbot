# Railway configuration for streaming AI chatbot
[global]
name = "streaming-ai-chatbot"
description = "Streaming AI chatbot with frontend and backend services"

# Backend service configuration
[service.backend]
name = "motia-chatbot"
dockerfile = "backend/Dockerfile.railway"
healthcheck_path = "/health"
healthcheck_timeout = 300

[service.backend.env]
NODE_ENV = "production"

# Frontend service configuration
[service.frontend]
name = "streaming-ai-chatbot-frontend"
dockerfile = "frontend/Dockerfile.railway"
healthcheck_path = "/"
healthcheck_timeout = 300

[service.frontend.env]
NODE_ENV = "production"
# Set REACT_APP_API_BASE in Railway dashboard to your backend service URL