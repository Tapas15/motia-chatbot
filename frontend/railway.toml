# Railway Configuration - Frontend
# YouTube to Book Summary Converter

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"

[deploy]
# Railway will automatically set the PORT environment variable
# The app listens on this port
healthcheckPath = "/"
healthcheckTimeout = 600
healthcheckInterval = 30
healthcheckStartPeriod = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Environment variables (set these in Railway dashboard)
# REACT_APP_API_BASE - Required for API integration
# Should point to the backend service URL
